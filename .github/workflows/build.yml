name: Build NovaClient

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - name: Prepare NovaClient.jar
        shell: bash
        run: |
          mkdir -p release
          
          # Tüm alt dizinler dahil oluşturan jar dosyasını bulur
          JAR=$(find . -type f \
            -name '*.jar' \
            ! -path "*/build/libs/*-sources.jar" \
            ! -path "*/build/libs/*-dev.jar" \
            ! -path "*/.gradle/*" \
            -path "*/build/libs/*.jar" \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "No mod JAR was generated."
            exit 1
          fi

          cp "$JAR" release/NovaClient.jar
          echo "Found and copied: $JAR"

      - name: Upload NovaClient.jar
        uses: actions/upload-artifact@v4
        with:
          name: NovaClient
          path: release/NovaClient.jar
          if-no-files-found: error
          
